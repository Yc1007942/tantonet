name: Mirror main to tanto_net

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tanto_static
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward tanto_net
        env:
          MIRROR_TOKEN: ${{ secrets.TANTONET_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$MIRROR_TOKEN" ]; then
            echo "Missing TANTONET_REPO_TOKEN repository secret."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add tanto-net "https://x-access-token:${MIRROR_TOKEN}@github.com/Yc1007942/tantonet.git"
          git fetch --no-tags tanto-net main

          # Only advance the target when it is an ancestor of this commit.
          # If either repository has independent changes, fail safely instead
          # of overwriting them or force-pushing production history.
          if git merge-base --is-ancestor "tanto-net/main" HEAD; then
            git push tanto-net HEAD:main
          else
            echo "tanto_net/main has commits that are not in tanto_static/main."
            echo "Resolve the divergence manually before retrying the mirror."
            exit 1
          fi
